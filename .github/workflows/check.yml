name: PR 검사

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 커밋 메시지 확인
        run: |
          MSGS=$(git log --format=%B origin/${{ github.base_ref }}..HEAD)
          echo "$MSGS" | grep -iE 'claude|anthropic|co-authored-by|gpt|chatgpt|openai|copilot|gemini|bard' > /dev/null && exit 1 || exit 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 코드 스타일 확인
        run: ./gradlew spotlessCheck --no-daemon

      - name: 컴파일 확인
        run: ./gradlew compileJava --no-daemon

      - name: 테스트 실행
        run: ./gradlew test --no-daemon
