server:
  port: 8090

spring:
  application:
    name: hunchaekbang

  servlet:
     multipart:
       max-file-size: 5MB
       max-request-size: 5MB

  datasource:
    url: jdbc:mysql://localhost:3307/hunchaekbang?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: hunchaekbang
    password: hunchaekbang1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 개발에서는 표를 자동으로 맞춤. 운영에서는 validate 로 둠.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6380
      password: redis1234

study:
  jwt:
    secret: hunchaekbang-local-dev-jwt-secret-key-32bytes-minimum
    access-expire-minutes: 30
    refresh-expire-days: 7

logging:
  level:
    com.example.study: debug

app:
  upload-dir: ./uploads
