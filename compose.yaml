services:
  db:
    image: mysql:8.4
    ports:
      - "3307:3306" # IDE에서 앱을 직접 실행할 때 씀(localhost:3307). 로컬에 다른 MySQL(3306)이 떠있을 수 있어 다르게 매핑.
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7.4
    ports:
      - "6380:6379" # IDE에서 앱을 직접 실행할 때 씀(localhost:6380)
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  app:
    build: .
    image: hunchaekbang-app:p1
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_REDIS_HOST: cache
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      STUDY_JWT_SECRET: ${JWT_SECRET}
      STUDY_JWT_ACCESS_EXPIRE_MINUTES: 30
      STUDY_JWT_REFRESH_EXPIRE_DAYS: 7
    volumes:
      - uploads:/app/uploads # 사진 업로드 기능 붙기 전까지는 안 쓰여도 무방
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

volumes:
  db-data:
  uploads:
